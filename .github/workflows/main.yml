name: Sync tasks.json from OneDrive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download tasks.json from OneDrive
        run: |
          curl -L -o tasks.json "${{ secrets.ONEDRIVE_URL }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tasks.json
          git diff --staged --quiet || git commit -m "Update tasks.json"
          git push
